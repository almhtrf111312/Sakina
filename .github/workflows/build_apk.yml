name: Build Al Muadhan APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # Pinned so the build does not change when ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache Android native build tools
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-cmake3.22.1

      - name: Install dependencies
        run: flutter pub get

      - name: Test navigation and daily azkar reset
        run: flutter test --no-pub

      - name: Build single compressed release APK
        id: apk
        env:
          ALMUADHAN_KEYSTORE_B64: ${{ secrets.ALMUADHAN_KEYSTORE_B64 }}
          ALMUADHAN_KEYSTORE_PASSWORD: ${{ secrets.ALMUADHAN_KEYSTORE_PASSWORD }}
          ALMUADHAN_KEY_ALIAS: ${{ secrets.ALMUADHAN_KEY_ALIAS }}
          ALMUADHAN_KEY_PASSWORD: ${{ secrets.ALMUADHAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/almuadhan-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export ALMUADHAN_KEYSTORE_PATH="$signing_dir/signing.p12"

          if [[ -n "$ALMUADHAN_KEYSTORE_B64" ]]; then
            : "${ALMUADHAN_KEYSTORE_PASSWORD:?Missing release keystore password}"
            : "${ALMUADHAN_KEY_ALIAS:?Missing release key alias}"
            : "${ALMUADHAN_KEY_PASSWORD:?Missing release key password}"
            printf '%s' "$ALMUADHAN_KEYSTORE_B64" | base64 --decode > "$ALMUADHAN_KEYSTORE_PATH"
            suffix=""
          else
            # Public, intentionally distributable test key. Keep these bytes
            # stable so preview APKs can update each other. Never use for production.
            echo "::notice::Signing this preview with the fixed public preview key."
            export ALMUADHAN_KEYSTORE_PASSWORD=preview-only
            export ALMUADHAN_KEY_PASSWORD="$ALMUADHAN_KEYSTORE_PASSWORD"
            export ALMUADHAN_KEY_ALIAS=preview
            base64 --decode > "$ALMUADHAN_KEYSTORE_PATH" <<'PREVIEW_KEY'
          MIIKNgIBAzCCCeAGCSqGSIb3DQEHAaCCCdEEggnNMIIJyTCCBbAGCSqGSIb3DQEHAaCCBaEEggWd
          MIIFmTCCBZUGCyqGSIb3DQEMCgECoIIFQDCCBTwwZgYJKoZIhvcNAQUNMFkwOAYJKoZIhvcNAQUM
