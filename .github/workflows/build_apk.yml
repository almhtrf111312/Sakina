name: Build Al Muadhan APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # Pinned so the build does not change when ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache Android native build tools
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-cmake3.22.1

      - name: Install dependencies
        run: flutter pub get

      - name: Test navigation and daily azkar reset
        run: flutter test --no-pub

      - name: Build single compressed release APK
        id: apk
        env:
          ALMUADHAN_KEYSTORE_B64: ${{ secrets.ALMUADHAN_KEYSTORE_B64 }}
          ALMUADHAN_KEYSTORE_PASSWORD: ${{ secrets.ALMUADHAN_KEYSTORE_PASSWORD }}
          ALMUADHAN_KEY_ALIAS: ${{ secrets.ALMUADHAN_KEY_ALIAS }}
          ALMUADHAN_KEY_PASSWORD: ${{ secrets.ALMUADHAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ALMUADHAN_KEYSTORE_B64" ]]; then
            : "${ALMUADHAN_KEYSTORE_PASSWORD:?Missing release keystore password}"
            : "${ALMUADHAN_KEY_ALIAS:?Missing release key alias}"
            : "${ALMUADHAN_KEY_PASSWORD:?Missing release key password}"
            umask 077
            export ALMUADHAN_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/almuadhan.XXXXXX")"
            trap 'rm -f "$ALMUADHAN_KEYSTORE_PATH"' EXIT
            printf '%s' "$ALMUADHAN_KEYSTORE_B64" | base64 --decode > "$ALMUADHAN_KEYSTORE_PATH"
            suffix=""
          else
            echo "::notice::Release signing is not configured. Uploading an installable preview signed with a temporary key."
            umask 077
            signing_dir="$(mktemp -d "$RUNNER_TEMP/almuadhan-preview.XXXXXX")"
            trap 'rm -rf "$signing_dir"' EXIT
            export ALMUADHAN_KEYSTORE_PATH="$signing_dir/preview.jks"
            export ALMUADHAN_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            export ALMUADHAN_KEY_PASSWORD="$ALMUADHAN_KEYSTORE_PASSWORD"
            export ALMUADHAN_KEY_ALIAS=preview
            keytool -genkeypair -storetype PKCS12 -keystore "$ALMUADHAN_KEYSTORE_PATH"               -storepass:env ALMUADHAN_KEYSTORE_PASSWORD -alias "$ALMUADHAN_KEY_ALIAS"               -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Al Muadhan Preview"
            suffix="-preview"
          fi
          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")" = "com.almuadhan.app"
          python3 - "$apk" <<'PYTHON'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for abi in ("armeabi-v7a", "arm64-v8a"):
                  assert apk.getinfo(f"lib/{abi}/libflutter.so").compress_type == zipfile.ZIP_DEFLATED, abi
          PYTHON
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          version="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          echo "version=${version%+*}${suffix}" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$apk" "artifacts/Al-Muadhan-${version%+*}${suffix}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muadhan-${{ steps.apk.outputs.version }}
          path: artifacts/Al-Muadhan-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
