name: Build Sakina APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # Pinned so the build does not change when ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build single universal release APK
        run: |
          flutter build apk --release
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/Sakina.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Sakina-APK
          path: artifacts/Sakina.apk
          retention-days: 30
