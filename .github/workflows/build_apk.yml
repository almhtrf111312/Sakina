name: Build Sakina APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build ARM64 Release APK (Optimized for modern devices)
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/sakina-arm64-release.apk

      - name: Build Universal Release APK (All architectures)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/sakina-universal-release.apk

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sakina-APKs
          path: artifacts/*.apk
          retention-days: 30
