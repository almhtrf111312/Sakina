name: Build Al Muadhan APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # Pinned so the build does not change when ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache Android native build tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-cmake3.22.1

      - name: Install dependencies
        run: flutter pub get

      - name: Test navigation and daily azkar reset
        run: flutter test --no-pub

      - name: Build single compressed release APK
        env:
          ALMUADHAN_KEYSTORE_B64: ${{ secrets.ALMUADHAN_KEYSTORE_B64 }}
          ALMUADHAN_KEYSTORE_PASSWORD: ${{ secrets.ALMUADHAN_KEYSTORE_PASSWORD }}
          ALMUADHAN_KEY_ALIAS: ${{ secrets.ALMUADHAN_KEY_ALIAS }}
          ALMUADHAN_KEY_PASSWORD: ${{ secrets.ALMUADHAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          suffix="-unsigned"
          if [[ -n "$ALMUADHAN_KEYSTORE_B64" ]]; then
            : "${ALMUADHAN_KEYSTORE_PASSWORD:?Missing release keystore password}"
            : "${ALMUADHAN_KEY_ALIAS:?Missing release key alias}"
            : "${ALMUADHAN_KEY_PASSWORD:?Missing release key password}"
            umask 077
            export ALMUADHAN_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/almuadhan.XXXXXX")"
            trap 'rm -f "$ALMUADHAN_KEYSTORE_PATH"' EXIT
            printf '%s' "$ALMUADHAN_KEYSTORE_B64" | base64 --decode > "$ALMUADHAN_KEYSTORE_PATH"
            suffix=""
          fi
          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")" = "com.almuadhan.app"
          python3 - "$apk" <<'PYTHON'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for abi in ("armeabi-v7a", "arm64-v8a"):
                  assert apk.getinfo(f"lib/{abi}/libflutter.so").compress_type == zipfile.ZIP_DEFLATED, abi
          PYTHON
          version="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          mkdir -p artifacts
          cp "$apk" "artifacts/Al-Muadhan-${version%+*}${suffix}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muadhan-APK
          path: artifacts/Al-Muadhan-*.apk
          compression-level: 0
          retention-days: 30
