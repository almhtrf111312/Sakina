          PREVIEW_KEY
            suffix="-preview"
          fi
          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")" = "com.almuadhan.app"
          python3 - "$apk" <<'PYTHON'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for abi in ("armeabi-v7a", "arm64-v8a"):
                  assert apk.getinfo(f"lib/{abi}/libflutter.so").compress_type == zipfile.ZIP_DEFLATED, abi
          PYTHON
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$signer"
          if [[ "$suffix" == "-preview" ]]; then
            "$signer" verify --verbose --print-certs "$apk" | tee "$signing_dir/verification.txt"
            actual="$(awk -F 'digest:[[:space:]]*' '/^Signer #1 certificate SHA-256 digest:/ {print $2}' "$signing_dir/verification.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            expected=4fe009f4a0373abf507a09c82d1803218e50614134b6a274b9d82d8e92d1aaa6
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Preview signing certificate did not match the pinned certificate."
              exit 1
            fi
          else
            "$signer" verify --verbose "$apk"
          fi
          version="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          echo "version=${version%+*}${suffix}" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$apk" "artifacts/Al-Muadhan-${version%+*}${suffix}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muadhan-${{ steps.apk.outputs.version }}
          path: artifacts/Al-Muadhan-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
