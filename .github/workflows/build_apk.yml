name: Build Al Muadhan APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    # Pinned so the build does not change when ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache Android native build tools
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-cmake3.22.1

      - name: Install dependencies
        run: flutter pub get

      - name: Test navigation and daily azkar reset
        run: flutter test --no-pub

      - name: Build single compressed release APK
        id: apk
        if: github.event_name != 'pull_request'
        env:
          ALMUADHAN_KEYSTORE_B64: ${{ secrets.ALMUADHAN_KEYSTORE_B64 }}
          ALMUADHAN_KEYSTORE_PASSWORD: ${{ secrets.ALMUADHAN_KEYSTORE_PASSWORD }}
          ALMUADHAN_KEY_ALIAS: ${{ secrets.ALMUADHAN_KEY_ALIAS }}
          ALMUADHAN_KEY_PASSWORD: ${{ secrets.ALMUADHAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/almuadhan-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export ALMUADHAN_KEYSTORE_PATH="$signing_dir/signing.p12"

          : "${ALMUADHAN_KEYSTORE_B64:?Missing private release keystore}"
          : "${ALMUADHAN_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${ALMUADHAN_KEY_ALIAS:?Missing release key alias}"
          : "${ALMUADHAN_KEY_PASSWORD:?Missing release key password}"
          printf '%s' "$ALMUADHAN_KEYSTORE_B64" | base64 --decode > "$ALMUADHAN_KEYSTORE_PATH"
          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")" = "com.almuadhan.app"
          python3 - "$apk" <<'PYTHON'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for abi in ("armeabi-v7a", "arm64-v8a"):
                  assert apk.getinfo(f"lib/{abi}/libflutter.so").compress_type == zipfile.ZIP_DEFLATED, abi
          PYTHON
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk" | tee "$signing_dir/verification.txt"
          actual="$(awk -F 'digest:[[:space:]]*' '/certificate SHA-256 digest:/ {print $2}' "$signing_dir/verification.txt" | tr -d ':[:blank:]\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          expected=6784d7cb36ebbccdb6e8d8e3028e2c16b2e37538c06581e8a64def4f11415059
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Release signing certificate did not match the pinned private identity."
            exit 1
          fi
          version="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          echo "version=${version%+*}" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$apk" "artifacts/Al-Muadhan-${version%+*}.apk"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Al-Muadhan-${{ steps.apk.outputs.version }}
          path: artifacts/Al-Muadhan-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
