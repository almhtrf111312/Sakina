name: sakina
description: Al Muadhan - المؤذان | Prayer Times, Quran, Azkar & Qibla
publish_to: 'none'
version: 1.2.20+23

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Notifications & Alarms
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Location & Compass
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0

  # Storage & Utilities
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/data/
    - assets/data/mushaf/
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
